# 推送 main 后自动构建 standalone 独立部署包并部署到 /opt/oak ，
# 也可在 Actions 页面手动触发（workflow_dispatch）。
#
# 部署包内容：server.js + 裁剪版 node_modules + .next（含 static）+ public + ecosystem.config.js
# 注意：部署包不含 data/、uploads/（用户数据不进制品）。
# 制品 oak-dist 部署成功后即删除以省存储额度；部署失败时保留 14 天供排查下载。
#
# 应用以 Docker 容器常驻：容器内由 pm2-runtime 拉起进程（挂载 /opt/oak，进程名 oak）。
# 每次部署解压到宿主机 /opt/oak 后，自动 docker exec 进容器 pm2 reload 生效，
# 无需手动重启容器。目标容器自动定位（找挂载 /opt/oak 的唯一运行中容器），
# 1Panel 等面板生成的随机容器名无需固定；如需精确指定可配 OAK_CONTAINER（可选）。
# 服务器侧要求：部署用户（OAK_USER）有 docker 权限，不在 docker 组则 usermod -aG docker <OAK_USER>。
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   OAK_HOST            服务器地址（IP 或域名）
#   OAK_USER            SSH 用户名
#   OAK_SSH_KEY         SSH 私钥完整内容（-----BEGIN ... 到 -----END ...）
#   OAK_PORT            可选，SSH 端口（默认 22）
#   OAK_KEY_PASSPHRASE  可选，私钥口令
#   OAK_CONTAINER       可选，应用容器名精确指定；不配则自动定位挂载 /opt/oak 的运行中容器

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # 上传/删除 Actions 制品（部署成功后清理省额度，失败留档）
  actions: write

env:
  OAK_HOST: ${{ secrets.OAK_HOST }}
  OAK_USER: ${{ secrets.OAK_USER }}
  OAK_KEY: ${{ secrets.OAK_SSH_KEY }}
  OAK_PORT: ${{ secrets.OAK_PORT }}
  OAK_KEY_PASSPHRASE: ${{ secrets.OAK_KEY_PASSPHRASE }}
  OAK_CONTAINER: ${{ secrets.OAK_CONTAINER }}

jobs:
  build-and-deploy:
    name: 构建并部署
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: |
          npm install
          npm run build

      - name: 组装部署包
        run: |
          # standalone 需手动补齐静态资源与 public
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          # 本机构建时 tracer 会把本地 data/ uploads/ 复制进产物；
          # CI 仓库里没有这两个目录，这里防御性清理，避免把数据带进制品
          rm -rf .next/standalone/data .next/standalone/uploads
          # 删除 tracer 顺带复制的运行无关文件（README/LICENSE、构建配置、
          # 源码目录、锁文件、README 截图等），压缩包不被这些拖累
          rm -rf \
            README.md LICENSE \
            eslint.config.mjs postcss.config.mjs tailwind.config.ts \
            tsconfig.json tsconfig.tsbuildinfo \
            package-lock.json skills-lock.json \
            src scripts images
          # pm2 进程配置随包分发：pm2-runtime 首次启动与 pm2 reload 共用仓库根的同一份
          cp ecosystem.config.js .next/standalone/
          tar -czf oak-dist.tar.gz -C .next/standalone .
          du -sh oak-dist.tar.gz

      - name: 上传制品（失败时留档排查用）
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: oak-dist
          path: oak-dist.tar.gz
          retention-days: 14

      - name: 上传解压并重启服务
        run: |
          set -euo pipefail
          : "${OAK_HOST:?缺少 OAK_HOST secret}"
          : "${OAK_USER:?缺少 OAK_USER secret}"
          : "${OAK_KEY:?缺少 OAK_SSH_KEY secret}"
          SSH_PORT="${OAK_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${OAK_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT}" -H "${OAK_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          # 私钥带口令时经 ssh-agent 挂载（用 printf 逐行生成 askpass，避免 heredoc 缩进问题）
          if [ -n "${OAK_KEY_PASSPHRASE}" ]; then
            eval "$(ssh-agent -s)" >/dev/null
            printf '%s\n' \
              '#!/bin/sh' \
              ': "${OAK_KEY_PASSPHRASE:?}"' \
              'printf "%s\n" "$OAK_KEY_PASSPHRASE"' > /tmp/askpass.sh
            chmod +x /tmp/askpass.sh
            export SSH_ASKPASS=/tmp/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            ssh-add ~/.ssh/id_ed25519
          fi

          # 注意：ssh 的端口参数是小写 -p，scp 的是大写 -P，不能共用同一组参数
          SSH_OPTS=(-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          ssh "${SSH_OPTS[@]}" -p "${SSH_PORT}" "${OAK_USER}@${OAK_HOST}" 'mkdir -p /opt/oak'
          scp "${SSH_OPTS[@]}" -P "${SSH_PORT}" oak-dist.tar.gz "${OAK_USER}@${OAK_HOST}:/opt/oak/oak-dist.tar.gz"

          # 解压到宿主机后通过 docker exec 让容器内 pm2 reload（fork 模式 reload 等价 restart）；
          # 全部成功才清理部署包，失败时留在服务器便于排查
          ssh "${SSH_OPTS[@]}" -p "${SSH_PORT}" "${OAK_USER}@${OAK_HOST}" '
            set -e
            cd /opt/oak
            rm -rf .next node_modules server.js public
            tar -xzf oak-dist.tar.gz
            test -f server.js && test -d .next/static
            if ! command -v docker >/dev/null 2>&1; then
              echo "::error::服务器上没有 docker 命令"
              exit 1
            fi
            # 定位目标容器：优先 OAK_CONTAINER 精确匹配（可选 secret）；否则自动找
            # 挂载了 /opt/oak 的运行中容器（须唯一），1Panel 随机容器名无需手填
            CT=""
            if [ -n '"$OAK_CONTAINER"' ] && docker ps --format "{{.Names}}" | grep -Fxq '"$OAK_CONTAINER"'; then
              CT='"$OAK_CONTAINER"'
            else
              CT=$(for id in $(docker ps -q); do
                if docker inspect -f "{{.Name}} {{range .Mounts}}{{.Source}} {{end}}" "$id" | grep -q " /opt/oak "; then
                  docker inspect -f "{{.Name}}" "$id" | sed "s|^/||"
                fi
              done | sort -u)
              n=$(printf "%s\n" "$CT" | grep -c . || true)
              if [ "$n" -ne 1 ]; then
                echo "::error::无法唯一定位应用容器（挂载 /opt/oak 的运行中容器找到 $n 个）。请在 GitHub Secrets 配置 OAK_CONTAINER 为完整容器名（docker ps 查看）"
                exit 1
              fi
            fi
            echo "目标容器: $CT"
            if ! docker exec "$CT" pm2 reload oak --update-env; then
              echo "::error::容器内 pm2 reload 失败：请核对 ①容器内启动命令为 pm2-runtime start ecosystem.config.js（进程名 oak）；②部署用户有 docker 权限（不在 docker 组则 usermod -aG docker <OAK_USER>）"
              exit 1
            fi
            rm -f oak-dist.tar.gz
            echo "pm2 reload 完成，新版本已生效（部署包已清理）"
            echo "部署完成，/opt/oak 当前内容："
            ls -la
          '

      - name: 部署成功后删除制品
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/actions/artifacts/${{ steps.artifact.outputs.artifact-id }}"
          echo "制品已删除；部署失败时会保留 14 天供排查下载"
