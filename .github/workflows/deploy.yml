# 自动构建部署：CI 上产出 standalone 独立运行包，服务器上零 npm install
#
# 服务器目录布局（首次部署自动创建）：
#   $DEPLOY_DIR(默认 /opt/oak)
#   ├── var/data/            SQLite 数据库（持久，跨版本保留）
#   ├── var/uploads/         上传的照片（持久）
#   ├── releases/<commit>/   每次部署的独立版本（含裁剪版 node_modules）
#   └── current -> releases/xxx  当前版本符号链接，pm2 运行 node current/server.js
#
# standalone 的 server.js 会 process.chdir(__dirname)，因此 data/uploads
# 必须以符号链接形式放进每个 release，指向 var/ 下的持久目录。

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build

      - name: 组装部署包
        run: |
          # standalone 需手动补齐静态资源与 public
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          # 本机构建时 tracer 会把本地 data/ uploads/ 复制进产物；
          # CI 仓库里没有这两个目录，这里防御性清理，避免把数据带进制品
          rm -rf .next/standalone/data .next/standalone/uploads
          tar -czf oak-dist.tar.gz -C .next/standalone .
          du -sh oak-dist.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: oak-dist
          path: oak-dist.tar.gz
          retention-days: 7

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      APP_PORT: ${{ secrets.APP_PORT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oak-dist

      - name: 上传产物
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > deploy_key
          chmod 600 deploy_key
          scp -P "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            -i deploy_key oak-dist.tar.gz "$SSH_USER@$SSH_HOST:/tmp/oak-dist.tar.gz"

      - name: 切换版本并重启
        run: |
          ssh -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new -i deploy_key \
            "$SSH_USER@$SSH_HOST" "DEPLOY_DIR='$DEPLOY_DIR' APP_PORT='$APP_PORT' SHA='$GITHUB_SHA' bash -s" <<'SCRIPT'
          set -e
          APP="${DEPLOY_DIR:-/opt/oak}"
          SHORT="$(echo "$SHA" | cut -c1-7)"
          mkdir -p "$APP/var/data" "$APP/var/uploads" "$APP/releases/$SHORT"
          tar -xzf /tmp/oak-dist.tar.gz -C "$APP/releases/$SHORT"
          rm -rf "$APP/releases/$SHORT/data" "$APP/releases/$SHORT/uploads"
          ln -sfn "$APP/var/data" "$APP/releases/$SHORT/data"
          ln -sfn "$APP/var/uploads" "$APP/releases/$SHORT/uploads"
          ln -sfn "releases/$SHORT" "$APP/current"
          cd "$APP"
          pm2 restart oak --update-env 2>/dev/null || pm2 start node --name oak -- current/server.js
          sleep 3
          curl -fsS "http://127.0.0.1:${APP_PORT:-3000}/login" >/dev/null && echo "健康检查通过"
          ls -1dt "$APP"/releases/* | tail -n +6 | xargs -r rm -rf
          rm -f /tmp/oak-dist.tar.gz
          SCRIPT

      - name: 清理私钥
        if: always()
        run: rm -f deploy_key
